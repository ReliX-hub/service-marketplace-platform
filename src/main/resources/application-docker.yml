spring:
  datasource:
    url: jdbc:postgresql://db:5432/marketplace
    username: marketplace
    password: marketplace
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    show-sql: false

  flyway:
    locations: classpath:db/migration

logging:
  level:
    com.relix.marketplace: INFO

jwt:
  secret: ${JWT_SECRET}
